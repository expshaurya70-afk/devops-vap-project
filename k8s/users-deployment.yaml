apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 2                     # run 2 copies for resilience — if one dies, the other keeps serving
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service         # this label is how the Service (below) finds these pods
    spec:
      containers:
        - name: users-service
          image: users-service:v1
          imagePullPolicy: IfNotPresent   # use the image we loaded, don't try to pull from the internet
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
          livenessProbe:            # "is this pod alive? if not, restart it"
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:           # "is this pod ready to receive traffic yet?"
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: users-service              # other pods reach this service at "http://users-service:8001"
spec:
  selector:
    app: users-service              # routes traffic to any pod with this label
  ports:
    - port: 8001
      targetPort: 8001
