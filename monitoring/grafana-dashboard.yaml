apiVersion: v1
data:
  devops-vap.json: |
    {
      "title": "DevOps VAP - Services",
      "uid": "devops-vap",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "CPU usage per pod (cores)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [ {
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\",container!=\"\"}[1m])) by (pod)",
            "legendFormat": "{{pod}}"
          } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Memory usage per pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [ {
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",container!=\"\"}) by (pod)",
            "legendFormat": "{{pod}}"
          } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "HPA replicas (orders-service)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 10, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\"}", "legendFormat": "current" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"default\"}", "legendFormat": "desired" }
          ]
        },
        {
          "id": 4, "type": "stat", "title": "Running pods (default namespace)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 4, "x": 10, "y": 8 },
          "targets": [ {
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "count(kube_pod_status_phase{namespace=\"default\",phase=\"Running\"} == 1)"
          } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Container restarts per pod",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 8 },
          "targets": [ {
            "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"default\"}) by (pod)",
            "legendFormat": "{{pod}}"
          } ]
        }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
