name: CI/CD Pipeline

# Trigger on every push to main
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [users-service, orders-service]
        # This runs the same steps twice — once per service — instead of duplicating the whole job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt

      - name: Run basic import check
        working-directory: ${{ matrix.service }}
        run: |
          python -c "import main; print('${{ matrix.service }} imports successfully')"
        # This is a lightweight stand-in for real tests — proves the app at least
        # loads without syntax/import errors before we bother building an image

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
